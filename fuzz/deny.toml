[advisories]
unmaintained = "all"
# Transitive through Lofty; no released Lofty version removes this dependency.
ignore = ["RUSTSEC-2024-0436"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]

# Inherited from suzumushi's PipeWire backend. Build-time only: both generate the
# FFI bindings and never link into a fuzz target. Kept in step with the root
# deny.toml, which carries the same two exceptions.
[[licenses.exceptions]]
name = "bindgen"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "libloading"
allow = ["ISC"]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
