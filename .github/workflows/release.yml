name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Verify and build Linux archive
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev

      - name: Install mise and project tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          if [[ "$version" != [0-9]* || "$version" == *[!0-9A-Za-z.+-]* ]]; then
            echo "Cargo version is not safe for release filenames: $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Verify project
        run: mise run ci

      - name: Build release binary
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          rustc --version --verbose
          rustc --version | grep -Fx 'rustc 1.97.1 (8bab26f4f 2026-07-14)'
          cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package and verify release archive
        run: |
          scripts/package-release.sh \
            "${{ steps.release.outputs.version }}" \
            x86_64-unknown-linux-gnu \
            "$GITHUB_SHA" \
            dist

      - name: Retain verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Retrieve verified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish immutable release inputs
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          archive="suzumushi-v$VERSION-x86_64-unknown-linux-gnu.tar.xz"
          test -f "$archive"
          test -f SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          flags=(
            --verify-tag
            --fail-on-no-commits
            --notes-from-tag
            --title "Suzumushi $VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS "${flags[@]}"
