name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Verify and build Linux archive
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libclang-dev \
            pkg-config

      - name: Install mise and project tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: false

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c '
          import json, sys
          print(json.load(sys.stdin)["packages"][0]["version"])
          ')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match" \
              "Cargo version $version" >&2
            exit 1
          fi
          if [[ "$version" != [0-9]* || "$version" == *[!0-9A-Za-z.+-]* ]]; then
            echo "Cargo version is not safe for release filenames: $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Verify project
        run: mise run ci

      - name: Build release binary
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          rustc --version --verbose
          rustc --version | grep -Fx 'rustc 1.97.1 (8bab26f4f 2026-07-14)'
          cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package and verify release archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/package-release.sh \
            "$VERSION" \
            x86_64-unknown-linux-gnu \
            "$GITHUB_SHA" \
            dist

      - name: Retain verified release files
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Retrieve verified release files
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish immutable release inputs
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          archive="suzumushi-v$VERSION-x86_64-unknown-linux-gnu.tar.xz"
          test -f "$archive"
          test -f SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          tag_ref="repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME"
          tag_type="$(gh api "$tag_ref" --jq '.object.type')"
          tag_sha="$(gh api "$tag_ref" --jq '.object.sha')"
          if [[ "$tag_type" != "tag" ]]; then
            echo "release tag must be annotated" >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/git/tags/$tag_sha" \
            --jq '.message' >RELEASE_NOTES.md
          flags=(
            --verify-tag
            --fail-on-no-commits
            --notes-file RELEASE_NOTES.md
            --title "Suzumushi $VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$archive" SHA256SUMS "${flags[@]}"
