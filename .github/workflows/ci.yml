name: CI

on:
  push:
    branches:
      - shrek
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Nix formatting
        run: nix fmt --no-update-lock-file -- --check flake.nix packaging/nix/package.nix

      - name: Build and test Nix package
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Verify flake entrypoint
        run: nix run --no-update-lock-file . -- --version

  ci:
    name: mise run ci
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libclang-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        run: rustc --version

      - name: Cache Rust dependencies
        # v2.9.2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            fuzz -> target
          cache-bin: false
          cache-all-crates: false
          cache-workspace-crates: false
          key: toolchains-${{ hashFiles('mise.toml') }}
          save-if: ${{ github.ref == 'refs/heads/shrek' }}

      - name: Install mise and project tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
          install: true
          cache: true

      - name: Verify project
        run: mise run ci
