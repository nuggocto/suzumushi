[advisories]
unmaintained = "all"
# Transitive through Lofty; no released Lofty version removes this dependency.
ignore = ["RUSTSEC-2024-0436"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Build-time only: both generate the PipeWire FFI bindings and never link into
# the shipped binary. Scoped per crate so neither license is allowed repository
# wide.
[[licenses.exceptions]]
name = "bindgen"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "libloading"
allow = ["ISC"]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
