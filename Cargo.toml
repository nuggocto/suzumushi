[package]
name = "suzumushi"
version = "1.1.2"
edition = "2024"
rust-version = "1.95.0"
description = "A calm, fully local terminal audio player for Linux"
license = "Apache-2.0"
repository = "https://github.com/nuggocto/suzumushi"
default-run = "suzumushi"
publish = false

[dependencies]
async-io = { version = "=2.6.0", default-features = false }
clap = { version = "=4.6.6", default-features = false, features = ["help", "std", "usage"] }
cpal = { version = "=0.18.1", default-features = false, features = ["pipewire", "realtime-dbus"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
futures-lite = { version = "=2.6.1", default-features = false, features = ["std"] }
lofty = { version = "=0.24.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
rtrb = { version = "=0.3.5", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", default-features = false, features = ["event", "fs", "process", "std"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = { version = "=2.0.20", default-features = false }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
insta = { version = "=1.48.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["pty", "termios"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace]
resolver = "3"
