[tools]
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-fuzz" = "0.13.2"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo --locked fmt --all --check"

[tasks.clippy]
description = "Lint all Rust targets"
env = { CARGO_BUILD_WARNINGS = "deny" }
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the locked Rust test and doctest suite"
env = { CARGO_BUILD_WARNINGS = "deny" }
run = "cargo test --locked --workspace"

[tasks.msrv]
description = "Verify the supported Rust 1.95.0 baseline"
env = { RUSTFLAGS = "-D warnings" }
run = "mise exec rust@1.95.0 -- cargo test --locked --workspace"

[tasks.security]
description = "Check dependency advisories, licenses, bans, and sources"
run = [
  "mise exec cargo:cargo-audit@0.22.2 -- cargo-audit audit --deny warnings --ignore RUSTSEC-2024-0436",
  "mise exec cargo:cargo-audit@0.22.2 -- cargo-audit audit --file fuzz/Cargo.lock --deny warnings --ignore RUSTSEC-2024-0436",
  "mise exec cargo:cargo-deny@0.20.2 -- cargo-deny check advisories bans licenses sources",
  "mise exec cargo:cargo-deny@0.20.2 -- cargo-deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check advisories bans licenses sources",
]

[tasks.fuzz-smoke]
description = "Run bounded untrusted-input fuzz smoke tests"
run = [
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run scanner_path_classification -- -max_total_time=5 -timeout=2 -rss_limit_mb=768 -max_len=4096 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run config -- -max_total_time=5 -timeout=2 -rss_limit_mb=768 -max_len=65536 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run metadata_adapter -- -max_total_time=5 -timeout=2 -rss_limit_mb=768 -max_len=1048576 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run terminal_safe_display -- -max_total_time=5 -timeout=2 -rss_limit_mb=768 -max_len=65536 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run audio_decoder -- -max_total_time=5 -timeout=2 -rss_limit_mb=768 -max_len=1048576 -verbosity=0",
]

[tasks.fuzz-deep]
description = "Run the bounded untrusted-input fuzz targets for longer"
run = [
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run scanner_path_classification -- -max_total_time=60 -timeout=2 -rss_limit_mb=768 -max_len=4096 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run config -- -max_total_time=60 -timeout=2 -rss_limit_mb=768 -max_len=65536 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run metadata_adapter -- -max_total_time=60 -timeout=2 -rss_limit_mb=768 -max_len=1048576 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run terminal_safe_display -- -max_total_time=60 -timeout=2 -rss_limit_mb=768 -max_len=65536 -verbosity=0",
  "mise exec rust@nightly-2026-07-01 -- cargo fuzz run audio_decoder -- -max_total_time=60 -timeout=2 -rss_limit_mb=768 -max_len=1048576 -verbosity=0",
]

[tasks.local-install-qa]
description = "Install the current checkout and exercise its public local workflow"
run = '''
set -eu
qa_dir=$(mktemp -d "${TMPDIR:-/tmp}/suzumushi-install-qa.XXXXXX")
cleanup() {
  rm -rf -- "${qa_dir:?}"
}
trap cleanup EXIT HUP INT TERM

cargo install --path . --locked --root "$qa_dir/prefix"
binary="$qa_dir/prefix/bin/suzumushi"
"$binary" --version | grep -E '^suzumushi [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
"$binary" init "$qa_dir/root" | grep -F 'then run `suzumushi --root <ROOT>`'
cp tests/fixtures/audio/tone.mp3 "$qa_dir/root/audio/library/tone.mp3"
"$binary" --root "$qa_dir/root" diagnose | grep -F 'tracks: 1'
'''

[tasks.ci]
description = "Run the complete project verification"
run = [
  { task = "fmt" },
  { task = "clippy" },
  { task = "test" },
  { task = "msrv" },
  { task = "security" },
  { task = "fuzz-smoke" },
]
